<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 1 -->
    <p>1 - Round</p>
    <input type="number" id="numRound">
    <button onclick="arredondarRound()">Arredondar</button>
    <p id="round"></p>

    <!-- 2 -->
    <p>2 - Floor</p>
    <input type="number" id="numFloor">
    <button onclick="arredondarFloor()">Arredondar</button>
    <p id="floor"></p>

    <!-- 3 -->
    <p>3 - Ceil</p>
    <input type="number" id="numCeil">
    <button onclick="arredondarCeil()">Arredondar</button>
    <p id="ceil"></p>

    <!-- 4 -->
    <p>4 - Raiz quadrada</p>
    <input type="number" id="numRaiz">
    <button onclick="fazerRaiz()">Ver raiz</button>
    <p id="raiz"></p>

    <!-- 5 -->
    <p>5 - Potência</p>
    <input type="number" id="potencia">
    <input type="number" id="numPot">
    <button onclick="fazerPot()">Ver potência</button>
    <p id="potencia2"></p>

    <!-- 6 -->
    <p>6 - Maior número</p>
    <input type="number" id="n1">
    <input type="number" id="n2">
    <input type="number" id="n3">
    <button onclick="maiorNum()">Ver maior número</button>
    <p id="max"></p>

    <!-- 7 -->
    <p>7 - Menor número</p>
    <input type="number" id="num1">
    <input type="number" id="num2">
    <input type="number" id="num3">
    <button onclick="menorNum()">Ver menor número</button>
    <p id="min"></p>

    <!-- 8 -->
    <p>8 - Sorteio de número (0 a 10)</p>
    <button onclick="sorteio()">Sortear número</button>
    <p id="resultadoSorteio"></p>

    <!-- 9 -->
    <p>9 - Simulador de dado</p>
    <button onclick="lancarDado()">Lançar dado</button>
    <p id="resultadoDado"></p>

    <script src="script.js"></script>
</body>
</html>
